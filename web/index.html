<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OBS Grid Designer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout layout-2">
      <!-- Combined sidebar -->
      <aside class="sidebar panel">
        <div class="side-block side-layouts">
          <div class="side-head">
            <h2>레이아웃</h2>
            <div class="actions tight">
              <button id="addChildLayoutBtn" type="button" title="하위 레이아웃 추가">+ 하위</button>
              <button id="deleteLayoutBtn" class="danger" type="button" title="삭제">삭제</button>
            </div>
          </div>
          <ul id="layoutTree" class="tree-list"></ul>
        </div>

        <div class="side-block side-children" id="childrenPanel">
          <div class="side-head">
            <h2>자식</h2>
            <span id="childHint" class="muted side-meta"></span>
          </div>
          <div class="actions tight wrap">
            <label class="file-pick-label primary-label" for="fileInput">이미지 추가</label>
            <input id="fileInput" class="file-input" type="file" accept="image/*" multiple />
            <button id="reflowGridBtn" type="button">격자</button>
            <button id="removeChildBtn" class="danger" type="button">제거</button>
            <button id="clearChildrenBtn" class="danger" type="button">전체</button>
          </div>
          <ul id="childList" class="child-list"></ul>
        </div>

        <div class="side-block side-settings">
          <div class="panel-scroll">
            <h2 id="settingsHeading">캔버스 설정</h2>
            <div class="form-row full">
              <label for="layoutName">이름</label>
              <input id="layoutName" type="text" value="Canvas" />
            </div>

            <div class="form-grid" id="layoutSizeRow">
              <div class="form-row">
                <label for="width" id="widthLabel">너비</label>
                <input id="width" type="number" value="1920" min="1" />
              </div>
              <div class="form-row">
                <label for="height" id="heightLabel">높이</label>
                <input id="height" type="number" value="1080" min="1" />
              </div>
            </div>
            <div class="actions tight wrap" id="canvasPresets">
              <button type="button" class="preset-size" data-w="1920" data-h="1080">1920×1080</button>
              <button type="button" class="preset-size" data-w="1280" data-h="720">1280×720</button>
              <button type="button" class="preset-size" data-w="1080" data-h="1920">1080×1920</button>
            </div>
            <label class="checkbox-row">
              <input id="scaleChildren" type="checkbox" />
              레이아웃 크기 변경 시 셀 크기도 스케일
            </label>

            <div class="form-grid">
              <div class="form-row">
                <label for="columns">열</label>
                <input id="columns" type="number" value="4" min="1" max="64" />
              </div>
              <div class="form-row">
                <label for="gap">간격</label>
                <input id="gap" type="number" value="10" min="0" />
              </div>
              <div class="form-row">
                <label for="padding">패딩</label>
                <input id="padding" type="number" value="20" min="0" />
              </div>
              <div class="form-row">
                <label for="aspect">셀 비율</label>
                <select id="aspect">
                  <option value="free">자유</option>
                  <option value="16:9">16:9</option>
                  <option value="4:3">4:3</option>
                </select>
              </div>
            </div>
            <label class="checkbox-row">
              <input id="keepSquare" type="checkbox" />
              정사각형 셀
            </label>

            <h2>정렬</h2>
            <div class="form-grid">
              <div class="form-row" id="cellAlignRow">
                <label for="cellAlign">셀→슬롯</label>
                <select id="cellAlign"></select>
              </div>
              <div class="form-row">
                <label for="contentAlign">이미지→셀</label>
                <select id="contentAlign"></select>
              </div>
            </div>
            <p id="cellAlignHint" class="muted"></p>
            <div id="alignPad" class="align-pad" title="이미지→셀 정렬"></div>

            <div class="form-row inline-bg">
              <label class="checkbox-row">
                <input id="transparentBg" type="checkbox" checked />
                배경 투명
              </label>
              <div id="bgColorRow" class="bg-color-inline">
                <input id="bgColor" type="color" value="#000000" disabled />
              </div>
            </div>

            <h2>내보내기</h2>
            <div class="actions tight wrap">
              <button id="exportPngBtn" class="primary" type="button">PNG 저장</button>
              <button id="changePngPathBtn" type="button">위치 변경</button>
            </div>
            <p id="savePaths" class="hint"></p>
            <div id="status" class="status">레이아웃을 구성하세요</div>
          </div>
        </div>
      </aside>

      <!-- Preview -->
      <section class="panel preview-panel">
        <div class="preview-head">
          <h2>미리보기</h2>
          <div class="preview-tools">
            <button id="zoomOutBtn" type="button" title="축소">−</button>
            <span id="zoomLabel" class="zoom-label">100%</span>
            <button id="zoomInBtn" type="button" title="확대">+</button>
            <button id="zoomResetBtn" type="button" title="맞춤">맞춤</button>
          </div>
        </div>
        <p id="previewMeta" class="muted"></p>
        <div class="preview-wrap" id="previewWrap" title="스크롤 휠로 확대/축소 · 이미지 드롭으로 추가">
          <div id="previewShell" class="preview-shell">
            <div id="previewStage" class="preview-stage"></div>
            <div id="canvasSizeBadge" class="canvas-size-badge" aria-hidden="true"></div>
          </div>
        </div>
      </section>
    </div>

    <canvas id="exportCanvas" hidden></canvas>
    <script src="js/grid.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
