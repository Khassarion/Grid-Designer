<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OBS Grid Designer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-bar">
      <div class="app-bar-left">
        <span class="app-brand">Grid Composer</span>
        <div class="app-bar-group" title="프로젝트 파일">
          <label class="file-pick-label" for="projectInput">열기</label>
          <input id="projectInput" class="file-input" type="file" accept="application/json,.json" />
          <button id="saveProjectBtn" type="button">저장</button>
        </div>
      </div>
      <div class="app-bar-center">
        <div id="status" class="status">레이아웃을 구성하세요</div>
        <p id="savePaths" class="hint app-bar-path"></p>
      </div>
      <div class="app-bar-right">
        <button id="changePngPathBtn" type="button" title="PNG 저장 위치 변경">위치 변경</button>
        <button id="exportPngBtn" class="primary" type="button">내보내기</button>
      </div>
    </header>

    <div class="layout layout-2">
      <!-- Combined sidebar -->
      <aside class="sidebar panel">
        <div class="side-block side-hierarchy" id="hierarchyPanel">
          <div class="side-head">
            <h2>계층 구조</h2>
          </div>
          <div class="actions tight wrap">
            <label class="file-pick-label primary-label" for="fileInput">이미지 추가</label>
            <input id="fileInput" class="file-input" type="file" accept="image/*" multiple />
            <button id="addChildLayoutBtn" type="button" title="하위 레이아웃 추가">+ 하위</button>
            <button id="reflowGridBtn" type="button">격자</button>
            <button id="removeNodeBtn" class="danger" type="button" title="선택 항목 제거">제거</button>
            <button id="clearChildrenBtn" class="danger" type="button" title="선택 대상의 자식 전체 제거">전체</button>
          </div>
          <ul id="layoutTree" class="tree-list"></ul>
        </div>

        <div class="side-block side-settings">
          <div class="panel-scroll">
            <h2 id="settingsHeading">레이아웃 설정</h2>
            <p id="noLayoutHint" class="muted">캔버스 선택됨 · 이미지 추가 시 최상위 레이아웃과 형제로 들어갑니다. 미리보기 빈 곳을 클릭해도 여기로 옵니다.</p>

            <div id="layoutSettingsBlock" hidden>
            <div class="form-grid" id="layoutSizeRow">
              <div class="form-row">
                <label for="width">너비</label>
                <input id="width" type="number" value="960" min="1" />
              </div>
              <div class="form-row">
                <label for="height">높이</label>
                <input id="height" type="number" value="540" min="1" />
              </div>
            </div>
            <div class="actions tight wrap" id="layoutPresets">
              <button type="button" class="preset-size layout-preset" data-w="200" data-h="1080">200×1080</button>
              <button type="button" class="preset-size layout-preset" data-w="1920" data-h="160">1920×160</button>
              <button type="button" class="preset-size layout-preset" data-w="400" data-h="1080">400×1080</button>
            </div>
            <p id="sizeLockHint" class="muted" hidden>부모 레이아웃 셀 크기로 고정</p>

            <div id="gridSettingsBlock">
              <h2>패딩</h2>
              <div class="form-grid cols-4">
                <div class="form-row">
                  <label for="padL">좌</label>
                  <input id="padL" type="number" value="0" min="0" />
                </div>
                <div class="form-row">
                  <label for="padR">우</label>
                  <input id="padR" type="number" value="0" min="0" />
                </div>
                <div class="form-row">
                  <label for="padT">상</label>
                  <input id="padT" type="number" value="0" min="0" />
                </div>
                <div class="form-row">
                  <label for="padB">하</label>
                  <input id="padB" type="number" value="0" min="0" />
                </div>
              </div>

              <h2>셀 크기</h2>
              <div class="form-grid">
                <div class="form-row">
                  <label for="cellW">가로</label>
                  <input id="cellW" type="number" value="200" min="1" />
                </div>
                <div class="form-row">
                  <label for="cellH">세로</label>
                  <input id="cellH" type="number" value="160" min="1" />
                </div>
              </div>
              <p class="muted">고정 크기 · 이미지는 셀에 꽉 채움</p>

              <h2>스페이싱</h2>
              <div class="form-grid">
                <div class="form-row">
                  <label for="spacingX">가로</label>
                  <input id="spacingX" type="number" value="0" />
                </div>
                <div class="form-row">
                  <label for="spacingY">세로</label>
                  <input id="spacingY" type="number" value="0" />
                </div>
              </div>
              <p class="muted">음수 가능 (겹침)</p>

              <h2>배치</h2>
              <div class="form-grid">
                <div class="form-row">
                  <label for="startCorner">시작 코너</label>
                  <select id="startCorner">
                    <option value="left-top">Left Top</option>
                    <option value="right-top">Right Top</option>
                    <option value="left-bottom">Left Bottom</option>
                    <option value="right-bottom">Right Bottom</option>
                  </select>
                </div>
                <div class="form-row">
                  <label for="startAxis">시작 축</label>
                  <select id="startAxis">
                    <option value="horizontal">수평</option>
                    <option value="vertical">수직</option>
                  </select>
                </div>
                <div class="form-row full">
                  <label for="childAlign">자식 정렬</label>
                  <select id="childAlign"></select>
                </div>
              </div>
              <p class="muted">자식 정렬 = 셀 그룹이 레이아웃 안 어디에 붙는지</p>
              <div id="alignPad" class="align-pad" title="자식 정렬"></div>

              <h2>제약</h2>
              <div class="form-row full">
                <select id="constraint">
                  <option value="auto">자동</option>
                  <option value="columns">열 개수</option>
                  <option value="rows">행 개수</option>
                </select>
              </div>
              <div class="form-row full" id="constraintCountRow" hidden>
                <label for="constraintCount">개수</label>
                <input id="constraintCount" type="number" value="4" min="1" max="64" />
              </div>
            </div>

            <div class="form-row inline-bg">
              <label class="checkbox-row">
                <input id="transparentBg" type="checkbox" checked />
                배경 투명
              </label>
              <div id="bgColorRow" class="bg-color-inline">
                <input id="bgColor" type="color" value="#000000" disabled />
              </div>
            </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Preview -->
      <section class="panel preview-panel">
        <div class="preview-head">
          <h2>미리보기</h2>
          <div class="canvas-size-bar" title="캔버스 크기">
            <label class="canvas-size-field">
              <span>너비</span>
              <input id="canvasWidth" type="number" value="1920" min="1" />
            </label>
            <span class="canvas-size-x">×</span>
            <label class="canvas-size-field">
              <span>높이</span>
              <input id="canvasHeight" type="number" value="1080" min="1" />
            </label>
            <div class="actions tight wrap canvas-presets" id="canvasPresets">
              <button type="button" class="preset-size canvas-preset" data-w="3840" data-h="2160">3840×2160</button>
              <button type="button" class="preset-size canvas-preset" data-w="2560" data-h="1440">2560×1440</button>
              <button type="button" class="preset-size canvas-preset" data-w="1920" data-h="1080">1920×1080</button>
            </div>
          </div>
          <div class="preview-tools">
            <button id="snapToggleBtn" type="button" class="toggle-btn active" title="자석 스냅">자석</button>
            <button id="zoomOutBtn" type="button" title="축소">−</button>
            <span id="zoomLabel" class="zoom-label">100%</span>
            <button id="zoomInBtn" type="button" title="확대">+</button>
            <button id="zoomResetBtn" type="button" title="맞춤">맞춤</button>
          </div>
        </div>
        <p id="previewMeta" class="muted"></p>
        <div class="preview-wrap" id="previewWrap" title="스크롤 휠로 확대/축소 · 이미지 드롭으로 추가">
          <div id="previewShell" class="preview-shell">
            <div id="previewStage" class="preview-stage"></div>
            <div id="canvasSizeBadge" class="canvas-size-badge" aria-hidden="true"></div>
          </div>
        </div>
      </section>
    </div>

    <canvas id="exportCanvas" hidden></canvas>
    <script src="js/grid.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
